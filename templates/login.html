{% extends "base.html" %}
{% block content %}
<h2>Log in</h2>
<form method="post">
  <input name="username" placeholder="Username" required>
  <input name="password" type="password" placeholder="Password" required>
  <button type="submit">Log in</button>
</form>
<p class="meta">No account? <a href="/register">Sign up</a></p>
{% endblock %}
